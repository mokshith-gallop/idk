  # ======================================================================
  # AC9 — Scan reduction: partition/cluster-filtered queries scan
  # materially fewer bytes than unfiltered on 10 hot-path objects.
  # Pattern: query_performance, mode: compare, dry_run: true
  # dry_run bytes are deterministic and free (no execution cost).
  # ======================================================================
  - pattern: query_performance
    id: scan-reduction-hotpath
    story_id: NBCS-TARGET-SCHEMA-AC9
    queries:
      - id: scan-fact_interaction
        mode: compare
        a: { sql: "SELECT * FROM dm.fact_interaction WHERE date_key BETWEEN 20200101 AND 20261231", dry_run: true }
        b: { sql: "SELECT * FROM dm.fact_interaction WHERE date_key = 20260601 AND agent_sk = 1", dry_run: true }
        compare:
          bytes_scanned: "b <= a"
      - id: scan-fact_agent_activity
        mode: compare
        a: { sql: "SELECT * FROM dm.fact_agent_activity WHERE date_key BETWEEN 20200101 AND 20261231", dry_run: true }
        b: { sql: "SELECT * FROM dm.fact_agent_activity WHERE date_key = 20260601 AND agent_sk = 1", dry_run: true }
        compare:
