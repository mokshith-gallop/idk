# =============================================================================
# nbcs_physical_schema.mvs.yaml
# Migration Validation Spec — BigQuery Physical Schema DDL
#
# Mode: build-and-verify (default)
# Applies 10 DDL files to a clean build dataset, then verifies the built
# result against source ground truth (manifests/tables.yaml + hive/ddl/*.hql).
#
# Objects: 115 (3 schemas + 98 tables + 2 MVs + 15 views)
# Columns: 916 across 100 data objects (98 tables + 2 MVs)
# =============================================================================

