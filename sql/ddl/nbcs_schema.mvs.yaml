  # -----------------------------------------------------------------------
  # AC6 — Queryability (SELECT * LIMIT 0 on all 115 objects + 3 tier queries)
  # -----------------------------------------------------------------------
  - pattern: queryability
    id: queryability
    select_star_limit_0:
      # All 98 tables + 2 MVs + 15 views (115 total)
      staging: [stg_crm_client, stg_crm_client_contact, stg_crm_program, stg_crm_contract, stg_crm_contract_line, stg_crm_sla_target, stg_hr_agent, stg_hr_org_unit, stg_hr_employment_event, stg_hr_skill, stg_hr_agent_skill, stg_wfm_shift, stg_wfm_schedule, stg_wfm_adherence_event, stg_wfm_forecast, stg_wfm_timeoff_request, stg_tel_call, stg_tel_call_segment, stg_tel_queue, stg_tel_agent_state_event, stg_tel_disposition_code, stg_tkt_ticket, stg_tkt_ticket_event, stg_tkt_category, stg_fin_invoice, stg_fin_invoice_line, stg_fin_rate_card, stg_fin_timesheet_delta, stg_fin_payroll_adj_delta, stg_crm_sla_credit_delta, stg_tel_callback_request_delta, stg_wfm_shift_swap_delta, stg_tkt_worklog_delta, stg_hr_attrition_event_delta, stg_fin_rate_card_change_delta, stg_file_interaction_export, stg_file_survey_csat, stg_file_qa_forms, stg_file_ivr_logs, stg_file_chat_transcripts, stg_file_roster, stg_file_telco_invoice, stg_file_dialer_result, stg_file_email_interaction, stg_file_speech_analytics]
      ods: [ods_program, ods_contract, ods_contract_line, ods_org_unit, ods_queue, ods_schedule, ods_adherence_event, ods_call, ods_ivr_session, ods_chat_session, ods_email_interaction, ods_survey_response, ods_qa_evaluation, ods_interaction, ods_dialer_attempt, ods_timesheet, ods_payroll_adjustment, ods_sla_credit, ods_callback_request, ods_shift_swap, ods_ticket_worklog, ods_attrition_event, ods_rate_card, ods_agent_scd2, ods_agent_skill_scd2, ods_agent_assignment_scd2, ods_client_acid, ods_agent_acid, ods_ticket_acid, ods_invoice_acid]
      dm: [dim_date, dim_agent, dim_client, dim_program, dim_queue, dim_site, dim_shift, dim_org, dim_disposition, fact_interaction, fact_agent_activity, fact_queue_interval, fact_csat_survey, fact_qa_evaluation, fact_billing_line, fact_adherence_daily, fact_ticket, fact_ivr_path, agg_agent_daily, agg_program_monthly, agg_queue_hourly, agg_csat_rollup_monthly, agg_billing_monthly, mv_agent_weekly, mv_site_daily, vw_org_hierarchy, vw_active_agents_ndv, vw_csat_rollup, vw_call_driver_regex, vw_repeat_contact_window, vw_billing_reconciliation, vw_agent_roster_current, vw_agent_scorecard, vw_attrition_risk, vw_queue_sla_attainment, vw_first_contact_resolution, vw_occupancy_utilization, vw_shrinkage_analysis, vw_program_margin, vw_client_executive_summary]
    tier_queries:
      - id: staging-tier
        sql: >
          SELECT c.client_code, p.program_code
          FROM staging.stg_crm_client c
          JOIN staging.stg_crm_program p ON p.client_id = c.client_id
          LIMIT 1
      - id: ods-tier
        sql: >
          SELECT o.contract_id, cl.unit_rate
          FROM ods.ods_contract o
          JOIN ods.ods_contract_line cl ON cl.contract_id = o.contract_id
          LIMIT 1
      - id: dm-tier
        sql: >
          SELECT f.interaction_id, a.full_name, f.handle_seconds
          FROM dm.fact_interaction f
          JOIN dm.dim_agent a ON a.agent_sk = f.agent_sk
          WHERE f.date_key = 20260601
          LIMIT 1

  # -----------------------------------------------------------------------
  # AC9 — Performance: scan reduction via clustering + partition filter
  # Prerequisite: fixture data loaded from datagen/ into the 10 hot-path tables.
  # -----------------------------------------------------------------------
  - pattern: perf_scan
    id: scan-reduction
    hot_path_tables:
      - { dataset: dm, table: fact_interaction,     cluster_filter: "agent_sk = 1",        partition_filter: "date_key = 20260601" }
      - { dataset: dm, table: fact_agent_activity,  cluster_filter: "agent_sk = 1",        partition_filter: "date_key = 20260601" }
      - { dataset: dm, table: fact_queue_interval,  cluster_filter: "queue_sk = 1",        partition_filter: "date_key = 20260601" }
      - { dataset: dm, table: fact_csat_survey,     cluster_filter: "program_sk = 1",      partition_filter: "date_key = 20260601" }
      - { dataset: dm, table: fact_billing_line,    cluster_filter: "client_sk = 1",       partition_filter: "period_month = '2026-06-01'" }
      - { dataset: dm, table: fact_adherence_daily, cluster_filter: "agent_sk = 1",        partition_filter: "date_key = 20260601" }
      - { dataset: dm, table: fact_ticket,          cluster_filter: "program_sk = 1",      partition_filter: "date_key = 20260601" }
      - { dataset: dm, table: agg_agent_daily,      cluster_filter: "agent_sk = 1",        partition_filter: "date_key = 20260601" }
      - { dataset: dm, table: agg_queue_hourly,     cluster_filter: "queue_sk = 1",        partition_filter: "date_key = 20260601" }
      - { dataset: ods, table: ods_interaction,     cluster_filter: "agent_id = 1" }
    require_partition_filter_tables:
      - { dataset: dm, table: fact_interaction }
      - { dataset: dm, table: fact_agent_activity }
      - { dataset: dm, table: fact_queue_interval }
