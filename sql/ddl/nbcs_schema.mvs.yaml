# ===========================================================================
# nbcs_schema.mvs.yaml — Mode-2 build-and-verify for the full BigQuery
# physical schema DDL (115 objects across 3 datasets: staging, ods, dm).
#
# The DDL files use fully-qualified dataset names (staging.X, ods.Y, dm.Z),
# so 01-create-datasets.sql creates the schemas first; subsequent files
# create tables/MVs/views within them. The harness applies each DDL file
# verbatim in lexicographic order.
#
# Validation suites run per-dataset schema_conformance against the live
# BQ catalog after DDL application. Source ground truth comes from
# manifests/tables.yaml + hive/ddl/*.hql (never from the DDL files).
# ===========================================================================
name: nbcs_full_schema_ddl
connections:
  target: { engine: bigquery }

migration:
  # DDL uses fully-qualified dataset names (staging/ods/dm), not the build
  # dataset. The build dataset is used only as the default dataset for the
  # harness; the actual objects live in their declared schemas.
  steps:
    - { kind: ddl, sql: sql/ddl/01-create-datasets.sql }
    - { kind: ddl, sql: sql/ddl/02-staging-sqoop-mirrors.sql }
    - { kind: ddl, sql: sql/ddl/03-staging-delta-feeds.sql }
    - { kind: ddl, sql: sql/ddl/04-staging-file-feeds.sql }
    - { kind: ddl, sql: sql/ddl/05-ods-cleanse.sql }
    - { kind: ddl, sql: sql/ddl/06-ods-delta-scd2.sql }
    - { kind: ddl, sql: sql/ddl/07-ods-acid.sql }
    - { kind: ddl, sql: sql/ddl/08-dm-tables.sql }
    - { kind: ddl, sql: sql/ddl/08b-dm-materialized-views.sql }
    - { kind: ddl, sql: sql/ddl/09-dm-views.sql }

suites:
  # -----------------------------------------------------------------------
  # Staging dataset: 45 tables (27 sqoop + 8 delta + 10 file-feed)
