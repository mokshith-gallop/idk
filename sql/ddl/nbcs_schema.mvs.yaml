  # -----------------------------------------------------------------------
  # AC5 — FK type consistency (56 documented join paths)
  # All FK→PK pairs must be same BQ type (INT64 ↔ INT64 or STRING ↔ STRING).
  # -----------------------------------------------------------------------
  - pattern: fk_consistency
    id: fk-types
    datasets: [staging, ods, dm]
    join_paths:
      # -- Surrogate key paths (agent_sk) --
      - { fk_dataset: dm, fk_table: fact_interaction,     fk_column: agent_sk,     pk_dataset: dm, pk_table: dim_agent,     pk_column: agent_sk,     type: INT64 }
      - { fk_dataset: dm, fk_table: fact_agent_activity,  fk_column: agent_sk,     pk_dataset: dm, pk_table: dim_agent,     pk_column: agent_sk,     type: INT64 }
      - { fk_dataset: dm, fk_table: fact_csat_survey,     fk_column: agent_sk,     pk_dataset: dm, pk_table: dim_agent,     pk_column: agent_sk,     type: INT64 }
      - { fk_dataset: dm, fk_table: fact_qa_evaluation,   fk_column: agent_sk,     pk_dataset: dm, pk_table: dim_agent,     pk_column: agent_sk,     type: INT64 }
      - { fk_dataset: dm, fk_table: fact_adherence_daily, fk_column: agent_sk,     pk_dataset: dm, pk_table: dim_agent,     pk_column: agent_sk,     type: INT64 }
      - { fk_dataset: dm, fk_table: agg_agent_daily,      fk_column: agent_sk,     pk_dataset: dm, pk_table: dim_agent,     pk_column: agent_sk,     type: INT64 }
      # -- Surrogate key paths (client_sk) --
      - { fk_dataset: dm, fk_table: fact_interaction,     fk_column: client_sk,    pk_dataset: dm, pk_table: dim_client,    pk_column: client_sk,    type: INT64 }
      - { fk_dataset: dm, fk_table: fact_billing_line,    fk_column: client_sk,    pk_dataset: dm, pk_table: dim_client,    pk_column: client_sk,    type: INT64 }
      - { fk_dataset: dm, fk_table: agg_billing_monthly,  fk_column: client_sk,    pk_dataset: dm, pk_table: dim_client,    pk_column: client_sk,    type: INT64 }
      - { fk_dataset: dm, fk_table: agg_program_monthly,  fk_column: client_sk,    pk_dataset: dm, pk_table: dim_client,    pk_column: client_sk,    type: INT64 }
      - { fk_dataset: dm, fk_table: agg_csat_rollup_monthly, fk_column: client_sk, pk_dataset: dm, pk_table: dim_client,    pk_column: client_sk,    type: INT64 }
      # -- Surrogate key paths (program_sk) --
      - { fk_dataset: dm, fk_table: fact_interaction,     fk_column: program_sk,   pk_dataset: dm, pk_table: dim_program,   pk_column: program_sk,   type: INT64 }
      - { fk_dataset: dm, fk_table: fact_billing_line,    fk_column: program_sk,   pk_dataset: dm, pk_table: dim_program,   pk_column: program_sk,   type: INT64 }
      - { fk_dataset: dm, fk_table: fact_csat_survey,     fk_column: program_sk,   pk_dataset: dm, pk_table: dim_program,   pk_column: program_sk,   type: INT64 }
      - { fk_dataset: dm, fk_table: fact_ticket,          fk_column: program_sk,   pk_dataset: dm, pk_table: dim_program,   pk_column: program_sk,   type: INT64 }
      - { fk_dataset: dm, fk_table: agg_program_monthly,  fk_column: program_sk,   pk_dataset: dm, pk_table: dim_program,   pk_column: program_sk,   type: INT64 }
      # -- Surrogate key paths (queue_sk) --
      - { fk_dataset: dm, fk_table: fact_interaction,     fk_column: queue_sk,     pk_dataset: dm, pk_table: dim_queue,     pk_column: queue_sk,     type: INT64 }
      - { fk_dataset: dm, fk_table: fact_queue_interval,  fk_column: queue_sk,     pk_dataset: dm, pk_table: dim_queue,     pk_column: queue_sk,     type: INT64 }
      - { fk_dataset: dm, fk_table: agg_queue_hourly,     fk_column: queue_sk,     pk_dataset: dm, pk_table: dim_queue,     pk_column: queue_sk,     type: INT64 }
      # -- Natural key paths (agent_id and agent aliases) --
      - { fk_dataset: staging, fk_table: stg_hr_employment_event, fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_hr_agent_skill,     fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_wfm_schedule,       fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_wfm_adherence_event, fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_wfm_timeoff_request, fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_tel_call,           fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_tel_call_segment,   fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_tel_agent_state_event, fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_tkt_ticket,         fk_column: opened_by_agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_tkt_ticket,         fk_column: assigned_agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_tkt_ticket_event,   fk_column: actor_agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_fin_timesheet_delta,  fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_fin_payroll_adj_delta, fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_tkt_worklog_delta,    fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_hr_attrition_event_delta, fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_file_dialer_result,   fk_column: agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
      - { fk_dataset: staging, fk_table: stg_wfm_shift_swap_delta, fk_column: requesting_agent_id, pk_dataset: staging, pk_table: stg_hr_agent, pk_column: agent_id, type: INT64 }
